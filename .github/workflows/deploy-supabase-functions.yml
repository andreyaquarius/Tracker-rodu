name: Deploy Supabase Edge Functions

on:
  push:
    branches: ["main"]
    paths:
      - "supabase/functions/**"
      - "supabase/migrations/**"
      - "supabase/config.toml"
      - "scripts/verify-external-pdf-rollout.mjs"
      - "services/pdf-export-worker/**"
      # process-gedcom-exports reuses Edge-safe GEDCOM modules from the app
      # source tree. Changes there must redeploy the function as well.
      - "src/types/**"
      - "src/utils/**"
      # These source-contract suites gate the context rollout below. Changes
      # to the tests themselves must rerun this workflow on Linux as well.
      - "test/churchRole*.test.ts"
      - "test/context*.test.ts"
      - "test/findingAiSocialRoles.test.ts"
      - "test/findingLegacyRelationIsolation.test.ts"
      - "test/googleDrive*.test.ts"
      - "test/geneHelp*.test.ts"
      - "test/zagulyakyPublicIndexingPerformance.test.ts"
      - "test/zagulyakySecurityDefinerApiIsolation.test.ts"
      - "test/personContext*.test.ts"
      - "test/personSocialCircleGraphPresentation.test.ts"
      - "test/researchGraph*.test.ts"
      - ".github/workflows/deploy-supabase-functions.yml"
      - ".github/workflows/telegram-inbox.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Every run targets the same linked production database. Keep the active
  # migration alive and queue the latest run instead of allowing overlapping
  # DDL transactions to block each other and the application.
  group: deploy-supabase-production
  cancel-in-progress: false

jobs:
  deploy-edge-functions:
    runs-on: ubuntu-latest

    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      TASK_REMINDER_CRON_SECRET: ${{ secrets.TASK_REMINDER_CRON_SECRET }}
      GA4_API_SECRET: ${{ secrets.GA4_API_SECRET }}
      GA4_MEASUREMENT_ID: G-SF2725LS4P
      APP_URL: ${{ vars.APP_URL }}
      ALLOWED_ORIGIN: ${{ vars.ALLOWED_ORIGIN }}
      PDF_EXPORT_WORKER_URL: ${{ secrets.PDF_EXPORT_WORKER_URL }}
      PDF_EXPORT_WORKER_SECRET: ${{ secrets.PDF_EXPORT_WORKER_SECRET }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
      TELEGRAM_WORKER_SECRET: ${{ secrets.TELEGRAM_WORKER_SECRET }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify PDF viewer contracts
        run: |
          npm run typecheck
          node --test \
            "test/documentSource*.test.ts" \
            "test/externalPdf*.test.ts" \
            "test/findingDocument*.test.ts" \
            "test/googleDrive*.test.ts" \
            "test/pdf*.test.ts" \
            "test/scanStorageExternalPreviewStrategy.test.ts" \
            "test/integration/externalPdfViewerCoreIntegration.test.ts"
          npm run test:e2e

      - name: Verify context graph rollout contracts
        run: |
          node --test --test-concurrency=1 \
            "test/churchRole*.test.ts" \
            "test/context*.test.ts" \
            "test/findingAiSocialRoles.test.ts" \
            "test/findingLegacyRelationIsolation.test.ts" \
            "test/personContext*.test.ts" \
            "test/personSocialCircleGraphPresentation.test.ts" \
            "test/researchGraph*.test.ts"

      - name: Verify GeneHelp notification sync contracts
        run: node --test --test-concurrency=1 "test/geneHelp*.test.ts"

      - name: Verify private-schema public facade ACL contracts
        run: |
          node --test --test-concurrency=1 \
            "test/zagulyakyPublicIndexingPerformance.test.ts" \
            "test/zagulyakySecurityDefinerApiIsolation.test.ts"

      - name: Verify PDF worker container
        run: docker build --tag tracker-rodu-pdf-worker:test services/pdf-export-worker

      - name: Verify Supabase deployment configuration
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Repository secret SUPABASE_ACCESS_TOKEN is missing."
            exit 1
          fi
          if [[ "$SUPABASE_ACCESS_TOKEN" != sbp_* ]]; then
            echo "::error::SUPABASE_ACCESS_TOKEN must be a Supabase personal access token (sbp_...), not an sb_secret_ API key or service-role key. Create it at https://supabase.com/dashboard/account/tokens."
            exit 1
          fi
          if [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "::error::Repository secret SUPABASE_PROJECT_REF is missing."
            exit 1
          fi
          if [ -z "$TASK_REMINDER_CRON_SECRET" ]; then
            echo "::error::Repository secret TASK_REMINDER_CRON_SECRET is missing."
            exit 1
          fi
          if [ -z "$GA4_API_SECRET" ]; then
            echo "::error::Repository secret GA4_API_SECRET is missing."
            exit 1
          fi
          if [ -z "$APP_URL" ] || [ -z "$ALLOWED_ORIGIN" ]; then
            echo "::error::Repository variables APP_URL and ALLOWED_ORIGIN are required for the PDF gateway CORS allowlist."
            exit 1
          fi
          if [ -z "$PDF_EXPORT_WORKER_URL" ]; then
            echo "::error::Repository secret PDF_EXPORT_WORKER_URL is required for DNS-pinned PDF streaming and large vector exports."
            exit 1
          fi
          if [ "${#PDF_EXPORT_WORKER_SECRET}" -lt 32 ]; then
            echo "::error::Repository secret PDF_EXPORT_WORKER_SECRET must contain at least 32 characters."
            exit 1
          fi
          if [ -z "$TELEGRAM_BOT_TOKEN" ]; then
            echo "::error::Repository secret TELEGRAM_BOT_TOKEN is required for Telegram intake."
            exit 1
          fi
          if ! [[ "$TELEGRAM_WEBHOOK_SECRET" =~ ^[A-Za-z0-9_-]{16,256}$ ]]; then
            echo "::error::Repository secret TELEGRAM_WEBHOOK_SECRET must be 16-256 URL-safe characters."
            exit 1
          fi
          if [ "${#TELEGRAM_WORKER_SECRET}" -lt 32 ]; then
            echo "::error::Repository secret TELEGRAM_WORKER_SECRET must contain at least 32 characters."
            exit 1
          fi
          node --input-type=module -e '
            const url = new URL(process.env.PDF_EXPORT_WORKER_URL);
            if (url.protocol !== "https:" || url.username || url.password || url.search || url.hash) {
              throw new Error("PDF_EXPORT_WORKER_URL must be a clean HTTPS URL without credentials, query or fragment.");
            }
          '

          node scripts/verify-external-pdf-rollout.mjs --deployment

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: 2.108.0

      - name: Verify Supabase account and project access
        run: |
          if ! status="$(curl --silent --show-error --retry 2 \
              --output "$RUNNER_TEMP/supabase-project.json" \
              --write-out "%{http_code}" \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF")"; then
            echo "::error::Could not connect to the Supabase Management API while verifying deployment credentials."
            exit 1
          fi

          case "$status" in
            200)
              echo "Supabase credentials and project access are valid."
              ;;
            401)
              echo "::error::Supabase rejected SUPABASE_ACCESS_TOKEN (HTTP 401). Replace it with an active personal access token from https://supabase.com/dashboard/account/tokens."
              exit 1
              ;;
            403)
              echo "::error::The Supabase account behind SUPABASE_ACCESS_TOKEN has no access to project $SUPABASE_PROJECT_REF (HTTP 403)."
              exit 1
              ;;
            404)
              echo "::error::SUPABASE_PROJECT_REF does not identify a project accessible to this token (HTTP 404)."
              exit 1
              ;;
            *)
              echo "::error::Could not verify Supabase project access (HTTP $status)."
              exit 1
              ;;
          esac

      - name: Link Supabase project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --yes

      - name: Verify Edge Function server secrets
        run: |
          if ! supabase secrets list --project-ref "$SUPABASE_PROJECT_REF" | grep -Eq '(^|[[:space:]])ENCRYPTION_KEY([[:space:]]|$)'; then
            echo "::error::Supabase Edge Function secret ENCRYPTION_KEY is required for private Google Drive PDF sessions."
            exit 1
          fi
          if ! supabase secrets list --project-ref "$SUPABASE_PROJECT_REF" | grep -Eq '(^|[[:space:]])GOOGLE_DRIVE_PUBLIC_API_KEY([[:space:]]|$)'; then
            echo "::error::Supabase Edge Function secret GOOGLE_DRIVE_PUBLIC_API_KEY is required for public Google Drive PDF shares."
            exit 1
          fi

      - name: Preview database migrations
        run: supabase db push --linked --dry-run

      - name: Apply database migrations
        shell: bash
        run: |
          max_attempts=3
          attempt=1

          while true; do
            log_file="$RUNNER_TEMP/supabase-db-push-attempt-${attempt}.log"

            set +e
            supabase db push --linked --yes 2>&1 | tee "$log_file"
            push_status=${PIPESTATUS[0]}
            set -e

            if [ "$push_status" -eq 0 ]; then
              break
            fi

            # Retry only PostgreSQL lock acquisition timeouts. Syntax,
            # validation, authorization, and data errors must fail immediately.
            if [ "$attempt" -ge "$max_attempts" ] \
              || ! grep -Eq 'ERROR:.*\(SQLSTATE 55P03\)' "$log_file"; then
              exit "$push_status"
            fi

            retry_delay=$((attempt * 15))
            echo "::warning::Database migration hit SQLSTATE 55P03; retrying in ${retry_delay}s (attempt $((attempt + 1))/${max_attempts})."
            sleep "$retry_delay"
            attempt=$((attempt + 1))
          done

      - name: Deploy Edge Functions
        run: |
          supabase secrets set \
            TASK_REMINDER_CRON_SECRET="$TASK_REMINDER_CRON_SECRET" \
            GA4_API_SECRET="$GA4_API_SECRET" \
            GA4_MEASUREMENT_ID="$GA4_MEASUREMENT_ID" \
            APP_URL="$APP_URL" \
            ALLOWED_ORIGIN="$ALLOWED_ORIGIN" \
            PDF_EXPORT_WORKER_URL="$PDF_EXPORT_WORKER_URL" \
            PDF_EXPORT_WORKER_SECRET="$PDF_EXPORT_WORKER_SECRET" \
            TELEGRAM_BOT_TOKEN="$TELEGRAM_BOT_TOKEN" \
            TELEGRAM_WEBHOOK_SECRET="$TELEGRAM_WEBHOOK_SECRET" \
            TELEGRAM_WORKER_SECRET="$TELEGRAM_WORKER_SECRET" \
            --project-ref "$SUPABASE_PROJECT_REF"

          for function_dir in supabase/functions/*; do
            if [ ! -d "$function_dir" ]; then
              continue
            fi

            function_name="$(basename "$function_dir")"
            if [[ "$function_name" == _* ]]; then
              continue
            fi

            echo "Deploying $function_name"
            supabase functions deploy "$function_name" --project-ref "$SUPABASE_PROJECT_REF"
          done

      - name: Register Telegram webhook
        run: |
          webhook_url="https://${SUPABASE_PROJECT_REF}.supabase.co/functions/v1/telegram-webhook"
          if ! response="$(curl --silent --show-error --fail-with-body --retry 2 --retry-all-errors --max-time 30 \
            --request POST \
            --data-urlencode "url=$webhook_url" \
            --data-urlencode "secret_token=$TELEGRAM_WEBHOOK_SECRET" \
            --data-urlencode 'allowed_updates=["message","callback_query"]' \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/setWebhook")"; then
            echo "::error::Telegram rejected webhook registration. Check TELEGRAM_BOT_TOKEN and function deployment."
            exit 1
          fi
          if ! jq --exit-status '.ok == true' <<<"$response" >/dev/null; then
            echo "::error::Telegram did not confirm webhook registration."
            exit 1
          fi

          if ! webhook_info="$(curl --silent --show-error --fail-with-body --retry 2 --retry-all-errors --max-time 30 \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/getWebhookInfo")"; then
            echo "::error::Could not verify Telegram webhook registration."
            exit 1
          fi
          if ! jq --exit-status --arg url "$webhook_url" \
            '.ok == true and .result.url == $url' <<<"$webhook_info" >/dev/null; then
            echo "::error::Telegram webhook URL does not point to telegram-webhook after registration."
            exit 1
          fi

      - name: Verify PDF gateway deployment
        run: |
          if ! supabase functions list --project-ref "$SUPABASE_PROJECT_REF" | grep -Eq '(^|[[:space:]])pdf-gateway([[:space:]]|$)'; then
            echo "::error::pdf-gateway is missing after Edge Function deployment."
            exit 1
          fi
          if ! supabase functions list --project-ref "$SUPABASE_PROJECT_REF" | grep -Eq '(^|[[:space:]])zagulyaka-attachment([[:space:]]|$)'; then
            echo "::error::zagulyaka-attachment is missing after Edge Function deployment."
            exit 1
          fi
          if ! supabase secrets list --project-ref "$SUPABASE_PROJECT_REF" | grep -Eq '(^|[[:space:]])PDF_EXPORT_WORKER_URL([[:space:]]|$)'; then
            echo "::error::PDF_EXPORT_WORKER_URL is missing after deployment."
            exit 1
          fi
          if ! supabase secrets list --project-ref "$SUPABASE_PROJECT_REF" | grep -Eq '(^|[[:space:]])PDF_EXPORT_WORKER_SECRET([[:space:]]|$)'; then
            echo "::error::PDF_EXPORT_WORKER_SECRET is missing after deployment."
            exit 1
          fi

      - name: Deliver overdue task reminders after deployment
        env:
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          CRON_SECRET: ${{ secrets.TASK_REMINDER_CRON_SECRET }}
        run: |
          if ! response="$(curl --fail-with-body --retry 2 --max-time 55 \
            -X POST \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "Content-Type: application/json" \
            "https://${PROJECT_REF}.supabase.co/functions/v1/send-task-reminders")"; then
            echo "::error::The reminder catch-up request failed after deployment."
            exit 1
          fi

          echo "$response"
          {
            echo "### Task reminder catch-up"
            echo '```json'
            echo "$response"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
