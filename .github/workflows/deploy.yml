name: Deploy Tracker Rodu to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify deployment configuration
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
          VITE_GOOGLE_PICKER_API_KEY: ${{ secrets.VITE_GOOGLE_PICKER_API_KEY }}
          VITE_GOOGLE_DRIVE_APP_ID: ${{ secrets.VITE_GOOGLE_DRIVE_APP_ID }}
          VITE_TELEGRAM_BOT_USERNAME: ${{ vars.VITE_TELEGRAM_BOT_USERNAME }}
        run: |
          if [ -z "$VITE_SUPABASE_URL" ]; then
            echo "::error::Repository secret VITE_SUPABASE_URL is missing."
            exit 1
          fi
          if [ -z "$VITE_SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "::error::Repository secret VITE_SUPABASE_PUBLISHABLE_KEY is missing."
            exit 1
          fi
          if [ -z "$VITE_GOOGLE_CLIENT_ID" ]; then
            echo "::error::Repository secret VITE_GOOGLE_CLIENT_ID is missing."
            exit 1
          fi
          if [ -z "$VITE_GOOGLE_PICKER_API_KEY" ]; then
            echo "::error::Repository secret VITE_GOOGLE_PICKER_API_KEY is missing."
            exit 1
          fi
          if [ -z "$VITE_GOOGLE_DRIVE_APP_ID" ]; then
            echo "::error::Repository secret VITE_GOOGLE_DRIVE_APP_ID is missing."
            exit 1
          fi

          # The Telegram deep link is optional during staged rollout.  When it
          # is not configured, the private Notes page still provides a code to
          # paste into the bot; when present, validate it before embedding it
          # into the public bundle.
          if [ -n "$VITE_TELEGRAM_BOT_USERNAME" ] \
            && ! [[ "$VITE_TELEGRAM_BOT_USERNAME" =~ ^[A-Za-z][A-Za-z0-9_]{4,63}[Bb][Oo][Tt]$ ]]; then
            echo "::error::Repository variable VITE_TELEGRAM_BOT_USERNAME must contain a valid public Telegram bot username when configured."
            exit 1
          fi

      - name: Typecheck
        run: npm run lint

      - name: Verify browser monitoring privacy
        run: node --test test/browserMonitoring.test.ts test/monitoredSupabaseFetch.test.ts

      - name: Build application and static public pages
        env:
          CUSTOM_DOMAIN: trekerrodu.com.ua
          VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN }}
          VITE_SENTRY_ENABLED: ${{ vars.VITE_SENTRY_ENABLED || 'true' }}
          VITE_SENTRY_ENVIRONMENT: production
          VITE_SENTRY_RELEASE: ${{ github.sha }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
          VITE_GOOGLE_PICKER_API_KEY: ${{ secrets.VITE_GOOGLE_PICKER_API_KEY }}
          VITE_GOOGLE_DRIVE_APP_ID: ${{ secrets.VITE_GOOGLE_DRIVE_APP_ID }}
          VITE_TELEGRAM_BOT_USERNAME: ${{ vars.VITE_TELEGRAM_BOT_USERNAME }}
          VITE_EXTERNAL_PDF_VIEWER_V2: ${{ vars.VITE_EXTERNAL_PDF_VIEWER_V2 || 'true' }}
          VITE_EXTERNAL_PDF_SOURCE_REVALIDATE_MINUTES: ${{ vars.VITE_EXTERNAL_PDF_SOURCE_REVALIDATE_MINUTES || '15' }}
          VITE_PDF_CLIENT_EXPORT_MAX_BYTES: ${{ vars.VITE_PDF_CLIENT_EXPORT_MAX_BYTES || '134217728' }}
          VITE_PDF_CLIENT_EXPORT_MAX_PAGES: ${{ vars.VITE_PDF_CLIENT_EXPORT_MAX_PAGES || '100' }}
          VITE_PDF_EXPORT_MAX_IMAGE_SIDE: ${{ vars.VITE_PDF_EXPORT_MAX_IMAGE_SIDE || '4096' }}
          VITE_PDF_EXPORT_IMAGE_SCALE: ${{ vars.VITE_PDF_EXPORT_IMAGE_SCALE || '2' }}
          VITE_PDF_EXPORT_MAX_ZIP_PIXELS: ${{ vars.VITE_PDF_EXPORT_MAX_ZIP_PIXELS || '80000000' }}
          VITE_PDF_EXPORT_MAX_ZIP_MEMORY_BYTES: ${{ vars.VITE_PDF_EXPORT_MAX_ZIP_MEMORY_BYTES || '402653184' }}
          VITE_PDF_VIEWER_RANGE_CHUNK_SIZE: ${{ vars.VITE_PDF_VIEWER_RANGE_CHUNK_SIZE || '1048576' }}
          VITE_PDF_VIEWER_MAX_DEVICE_PIXEL_RATIO: ${{ vars.VITE_PDF_VIEWER_MAX_DEVICE_PIXEL_RATIO || '2' }}
          VITE_PDF_VIEWER_MAX_RENDER_SCALE: ${{ vars.VITE_PDF_VIEWER_MAX_RENDER_SCALE || '4' }}
          VITE_PDF_VIEWER_MAX_CONCURRENT_RENDERS: ${{ vars.VITE_PDF_VIEWER_MAX_CONCURRENT_RENDERS || '1' }}
          VITE_PDF_VIEWER_MAX_CANVAS_PIXELS: ${{ vars.VITE_PDF_VIEWER_MAX_CANVAS_PIXELS || '16777216' }}
          VITE_PDF_VIEWER_MAX_CANVAS_SIDE: ${{ vars.VITE_PDF_VIEWER_MAX_CANVAS_SIDE || '8192' }}
        run: |
          # An unset repository variable becomes an empty environment value.
          # Let Vite use the public .env.production DSN unless it is overridden.
          # Use VITE_SENTRY_ENABLED=false to disable reporting explicitly.
          if [ -z "${VITE_SENTRY_DSN:-}" ]; then
            unset VITE_SENTRY_DSN
          fi
          npm run build

      # GitHub Pages cannot serve SPA deep links as indexable documents.  Build
      # a privacy-safe static public projection from anonymous catalogue RPCs
      # after Vite has produced its HTML template.
      - name: Generate indexable public Zagulyaky pages and sitemap
        # The generator retries temporary PostgREST/schema-cache failures and
        # then attempts its public catalogue fallback. Keep the whole recovery
        # path bounded if Supabase is broadly unavailable.
        timeout-minutes: 8
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: node scripts/generate-zagulyaky-public-pages.mjs

      - name: Verify prerendered public output
        run: npm run verify:pages

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Upload website
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          name: github-pages-${{ github.run_attempt }}
          path: ./dist

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
