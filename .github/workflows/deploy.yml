name: Deploy Tracker Rodu to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify deployment configuration
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
          VITE_GOOGLE_PICKER_API_KEY: ${{ secrets.VITE_GOOGLE_PICKER_API_KEY }}
          VITE_GOOGLE_DRIVE_APP_ID: ${{ secrets.VITE_GOOGLE_DRIVE_APP_ID }}
        run: |
          if [ -z "$VITE_SUPABASE_URL" ]; then
            echo "::error::Repository secret VITE_SUPABASE_URL is missing."
            exit 1
          fi
          if [ -z "$VITE_SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "::error::Repository secret VITE_SUPABASE_PUBLISHABLE_KEY is missing."
            exit 1
          fi
          if [ -z "$VITE_GOOGLE_CLIENT_ID" ]; then
            echo "::error::Repository secret VITE_GOOGLE_CLIENT_ID is missing."
            exit 1
          fi
          if [ -z "$VITE_GOOGLE_PICKER_API_KEY" ]; then
            echo "::error::Repository secret VITE_GOOGLE_PICKER_API_KEY is missing."
            exit 1
          fi
          if [ -z "$VITE_GOOGLE_DRIVE_APP_ID" ]; then
            echo "::error::Repository secret VITE_GOOGLE_DRIVE_APP_ID is missing."
            exit 1
          fi

      - name: Typecheck
        run: npm run lint

      - name: Build application and static public pages
        env:
          CUSTOM_DOMAIN: trekerrodu.com.ua
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
          VITE_GOOGLE_PICKER_API_KEY: ${{ secrets.VITE_GOOGLE_PICKER_API_KEY }}
          VITE_GOOGLE_DRIVE_APP_ID: ${{ secrets.VITE_GOOGLE_DRIVE_APP_ID }}
          VITE_EXTERNAL_PDF_VIEWER_V2: ${{ vars.VITE_EXTERNAL_PDF_VIEWER_V2 || 'true' }}
          VITE_EXTERNAL_PDF_SOURCE_REVALIDATE_MINUTES: ${{ vars.VITE_EXTERNAL_PDF_SOURCE_REVALIDATE_MINUTES || '15' }}
          VITE_PDF_CLIENT_EXPORT_MAX_BYTES: ${{ vars.VITE_PDF_CLIENT_EXPORT_MAX_BYTES || '134217728' }}
          VITE_PDF_CLIENT_EXPORT_MAX_PAGES: ${{ vars.VITE_PDF_CLIENT_EXPORT_MAX_PAGES || '100' }}
          VITE_PDF_EXPORT_MAX_IMAGE_SIDE: ${{ vars.VITE_PDF_EXPORT_MAX_IMAGE_SIDE || '4096' }}
          VITE_PDF_EXPORT_IMAGE_SCALE: ${{ vars.VITE_PDF_EXPORT_IMAGE_SCALE || '2' }}
          VITE_PDF_EXPORT_MAX_ZIP_PIXELS: ${{ vars.VITE_PDF_EXPORT_MAX_ZIP_PIXELS || '80000000' }}
          VITE_PDF_EXPORT_MAX_ZIP_MEMORY_BYTES: ${{ vars.VITE_PDF_EXPORT_MAX_ZIP_MEMORY_BYTES || '402653184' }}
          VITE_PDF_VIEWER_RANGE_CHUNK_SIZE: ${{ vars.VITE_PDF_VIEWER_RANGE_CHUNK_SIZE || '1048576' }}
          VITE_PDF_VIEWER_MAX_DEVICE_PIXEL_RATIO: ${{ vars.VITE_PDF_VIEWER_MAX_DEVICE_PIXEL_RATIO || '2' }}
          VITE_PDF_VIEWER_MAX_RENDER_SCALE: ${{ vars.VITE_PDF_VIEWER_MAX_RENDER_SCALE || '4' }}
          VITE_PDF_VIEWER_MAX_CONCURRENT_RENDERS: ${{ vars.VITE_PDF_VIEWER_MAX_CONCURRENT_RENDERS || '1' }}
          VITE_PDF_VIEWER_MAX_CANVAS_PIXELS: ${{ vars.VITE_PDF_VIEWER_MAX_CANVAS_PIXELS || '16777216' }}
          VITE_PDF_VIEWER_MAX_CANVAS_SIDE: ${{ vars.VITE_PDF_VIEWER_MAX_CANVAS_SIDE || '8192' }}
        run: npm run build

      - name: Verify prerendered public output
        run: npm run verify:pages

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload website
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v5
