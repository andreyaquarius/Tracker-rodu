name: Maintain private Telegram inbox (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: telegram-private-inbox
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    # The Telegram bot is temporarily Notes-only, so routine worker execution
    # is disabled. This manual recovery path remains for fenced-media cleanup
    # and safe handling of legacy intake rows.
    timeout-minutes: 8
    steps:
      - name: Verify Telegram inbox worker secrets
        env:
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          WORKER_SECRET: ${{ secrets.TELEGRAM_WORKER_SECRET }}
        run: |
          if [ -z "$PROJECT_REF" ] || [ -z "$WORKER_SECRET" ]; then
            echo "::error::SUPABASE_PROJECT_REF and TELEGRAM_WORKER_SECRET are required."
            exit 1
          fi

      - name: Process a bounded private Telegram inbox slice
        env:
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          WORKER_SECRET: ${{ secrets.TELEGRAM_WORKER_SECRET }}
        run: |
          if ! response="$(curl --fail-with-body --retry 2 --retry-all-errors --max-time 420 \
            -X POST \
            -H "Authorization: Bearer $WORKER_SECRET" \
            -H "Content-Type: application/json" \
            --data '{"limit":3}' \
            "https://${PROJECT_REF}.supabase.co/functions/v1/process-telegram-inbox")"; then
            echo "::error::Telegram inbox worker request failed."
            exit 1
          fi

          # The worker returns counters only; source texts, photos, paths,
          # Telegram IDs, candidate fields, and provider diagnostics stay out
          # of the GitHub log and summary.
          echo "$response"
          if ! jq --exit-status '.accepted == true and (.failed // 0) == 0' <<<"$response" >/dev/null; then
            echo "::error::Telegram inbox worker reported a failed task. Check the safe last_error_code aggregate in Supabase."
            exit 1
          fi
          {
            echo "### Private Telegram inbox"
            echo '```json'
            echo "$response"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
